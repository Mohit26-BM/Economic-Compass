# API (FastAPI + DuckDB) and dashboard (nginx). The warehouse is a single file, so no database
# server is needed. Copy .env.example to .env first (only needed to re-run ingestion).
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    environment:
      DUCKDB_PATH: /app/data/warehouse.duckdb
      # Set to the number of reverse proxies in front of the API so rate limits see real visitors.
      TRUSTED_PROXY_HOPS: "0"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./ml/artifacts:/app/ml/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  dashboard:
    build:
      context: ./dashboard
      dockerfile: ../docker/dashboard.Dockerfile
      args:
        # The browser calls the API directly, so this must be an address the BROWSER can reach.
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api
